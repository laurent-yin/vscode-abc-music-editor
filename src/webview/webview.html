<!DOCTYPE html>
<html lang="en" allow="midi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ABC Preview</title>
	<style>
        @font-face { font-family: ABCGridMusic; src: url('__BASE_URI__/lib/abc2svg.woff2') format('woff2'); }
        @font-face { font-family: ABCGridChord; src: url('__BASE_URI__/lib/FreeSerif-chords.woff2') format('woff2'); font-weight: 400; font-style: normal; }
        body { font-family: var(--vscode-font-family, sans-serif); }
        #preview-toolbar { display: flex; align-items: center; gap: .4em; margin-bottom: .4em; }
        #preview-toolbar > button { flex-shrink: 0; }
        #preview-toolbar .voice-toggle { min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: transparent; color: inherit; padding: 4px 2px; text-align: left; }
        .voice-panel { position: fixed; inset: 3em .5em auto auto; margin: 0; width: min(25em, calc(100vw - 1em)); box-sizing: border-box; max-height: calc(100dvh - 4em); overflow: auto; padding: .6em; color: var(--vscode-editor-foreground, #222); background: var(--vscode-editor-background, white); border: 1px solid var(--vscode-widget-border, #888); box-shadow: 0 4px 16px #0004; }
        .voice-panel fieldset { border: 0; padding: .2em 0; margin: 0; }
        .voice-panel label { display: flex; align-items: center; gap: .4em; margin: .3em 0; }
        .voice-panel input[type=checkbox] { order: -1; }
        .voice-row { display: flex; flex-wrap: wrap; align-items: center; gap: .4em; margin: .3em 0; }
        .voice-row > label:first-child { flex: 1 1 10em; }
        .voice-row .voice-notation { font-size: 12px; }
        .voice-row input[type=number] { width: 3em; }
        #file-controls { display: contents; }
        .file-control { display: inline-flex; align-items: center; gap: .2em; flex-shrink: 0; font-size: 12px; white-space: nowrap; }
        .file-control select { width: 3.5em; font: inherit; }
        .chord-source-control { flex-wrap: wrap; }
        .chord-source-control select { min-width: 0; max-width: 100%; }
        html:has(body.grid-only-preview) { overflow: clip; }
        body.grid-only-preview { height: calc(100dvh - 16px); display: flex; flex-direction: column; min-width: 0; overflow: clip; }
        .grid-only-preview #preview-toolbar { flex: 0 0 auto; flex-wrap: wrap; }
        .grid-only-preview #preview-status { flex: 0 0 auto; }
        .grid-only-preview #sheet { flex: 1; min-height: 0; min-width: 0; }
        .grid-page { display: flow-root; }
        .chord-grid { display: flow-root; min-width: 0; overflow-wrap: anywhere; color: var(--vscode-editor-foreground, #222); background: var(--vscode-editor-background, white); font-family: sans-serif; }
        .chord-grid h2 { margin: .4em 0; text-align: center; font-size: 20px; }
        .grid-composer { margin: 0 8px; text-align: right; }
        .grid-viewport { max-width: 100%; }
        .grid-only-preview .grid-viewport { max-width: none; width: max-content; }
        .chord-grid svg { fill: currentColor; max-width: 100%; height: auto; }
        .grid-only-preview .chord-grid svg { max-width: none; }
        .chord-grid .abcr { cursor: pointer; }
        .chord-grid .abcr.selected { fill: #0078d722; stroke: #0078d7; }
        .chord-grid .abcr.grid-playing { fill: #00a87033; }
        .chord-grid .grid-chord { pointer-events: none; }
        .file-control input { width: 3em; }
        .transposition-box { display: inline-flex; align-items: center; gap: .15em; padding-right: .3em; border: 1px solid var(--vscode-input-border, #888); background: var(--vscode-input-background, white); color: var(--vscode-input-foreground, #222); }
        .transposition-box input { border: 0; background: transparent; color: inherit; font: inherit; padding: 2px; }
        .transposition-box:focus-within { outline: 1px solid var(--vscode-focusBorder, #007acc); }
        #song-key { max-width: 6em; overflow: hidden; text-overflow: ellipsis; }
        .tempo-input { display: inline-flex; border: 1px solid var(--vscode-input-border, #888); }
        #playback-tempo { width: 3.7em; font: inherit; border: 0; appearance: textfield; }
        #playback-tempo::-webkit-inner-spin-button, #playback-tempo::-webkit-outer-spin-button { display: none; }
        .tempo-steps { display: flex; flex-direction: column; }
        .tempo-steps button { width: 1.4em; height: 12px; padding: 0; font-size: 10px; line-height: 10px; }
        #tempo-picker { position: fixed; inset: auto; margin: 0; width: 10em; max-width: calc(100vw - 16px); padding: .3em; box-sizing: border-box; color: var(--vscode-editor-foreground, #222); background: var(--vscode-editor-background, white); border: 1px solid var(--vscode-widget-border, #888); box-shadow: 0 4px 16px #0004; }
        .tempo-original { width: 100%; padding: .4em; }
        .tempo-options { height: min(252px, calc(100dvh - 100px)); overflow-y: auto; box-sizing: border-box; overscroll-behavior: contain; scroll-behavior: auto; }
        .tempo-options button { display: block; width: 100%; height: 28px; padding: 0; border: 0; font: inherit; color: inherit; background: transparent; cursor: pointer; }
        .tempo-options button:hover, .tempo-options button:focus-visible, .tempo-options [aria-selected=true] { color: var(--vscode-list-activeSelectionForeground, white); background: var(--vscode-list-activeSelectionBackground, #005a9e); }
        #original-tempo { font-size: 11px; }
        .tempo-control { flex-wrap: wrap; max-width: 100%; }
        #tempo-error:not([hidden]) { white-space: normal; max-width: 18em; flex-basis: 100%; }
        .voice-panel > button { margin-left: .6em; }
        #preferences-toggle { margin-left: auto; padding: 4px; }
        #preferences-panel {
            position: fixed; inset: 3em .5em auto auto; margin: 0;
            box-sizing: border-box; width: min(42em, calc(100vw - 1em));
            max-height: calc(100dvh - 4em); overflow: auto; padding: 1em;
            color: var(--vscode-editor-foreground, #222);
            background: var(--vscode-editor-background, white);
            border: 1px solid var(--vscode-widget-border, #888);
            box-shadow: 0 4px 16px #0004;
        }
        @media (max-width: 360px) {
            #preview-toolbar { gap: .2em; font-size: 12px; }
            #preview-toolbar > button { padding: 2px; font-size: 12px; }
        }
        @media (max-width: 600px) {
            #preview-toolbar { flex-wrap: wrap; }
            .file-control .header-label { display: none; }
            .transposition-box input { width: 2.5em; appearance: textfield; }
            .transposition-box input::-webkit-inner-spin-button, .transposition-box input::-webkit-outer-spin-button { display: none; }
        }
        .preferences-toolbar { display: flex; flex-wrap: wrap; gap: 1em; align-items: start; }
        #personal-controls details { padding: .5em; border: 1px solid currentColor; max-width: 28em; }
        #personal-controls label, #personal-controls small { display: block; margin: .4em 0; }
        #personal-controls textarea { display: block; width: 95%; }
        #personal-controls input[type=number] { width: 5em; }
        #personal-controls button { margin: .2em; }
        .error { color: var(--vscode-errorForeground, #b00020); }
        #preview-status { white-space: pre-wrap; padding: .6em; border: 1px solid currentColor; }
        .warning { color: var(--vscode-editorWarning-foreground, #805500); }
		#play-button {
			margin: 10px;
			padding: 6px 12px;
			font-size: 14px;
		}

		/* Block display for SVG prevents gaps between musical lines */
		svg {
			display: block;
		}

		/* important to remove white bands between each svg block */
		svg text {
			user-select: none;
		}

		/* Prevents text selection in SVG */
		.showbox svg {
			background: white;
		}

		#sheet.showbox {
			background-color: lightgray;
		}
	</style>
	<script>
		/* 
		 * baseUri is replaced by the extension with the actual URI to access resources
		 * This is used to load scripts and other resources with the correct path
		 */
		window.baseUri = '__BASE_URI__';
	</script>
	<!-- 
	 * abc2svg-1.js - Main library that converts ABC notation to SVG graphics
	 * This library provides the core functionality for rendering musical notation
	 -->
	<script src="__BASE_URI__/lib/abc2svg-1.js" type="text/javascript"></script>
	<!-- 
	 * lz-string.min.js - Compression library used when sharing ABC content with external editor
	 * Used by the "Open in Michael Eskin's Web Editor" button to compress ABC data for URL parameters
	 -->
	<script src="__BASE_URI__/out/lib/lz-string.min.js" type="text/javascript"></script>
    <script type="importmap">
        {"imports":{"abctools/preferences":"__BASE_URI__/out/lib/preferences.js","abctools/chord-grid":"__BASE_URI__/out/lib/chordGrid.js"}}
    </script>
</head>

<body>
    <div id="preview-toolbar" role="group" aria-label="Playback and preview controls">
	<!-- Play button that triggers MIDI playback of the ABC music -->
	<button id="play-pause-btn" aria-label="Play">
		<!-- Play icon (default) -->
		<svg id="icon-play" width="24" height="24" viewBox="0 0 24 24">
			<polygon points="6,4 20,12 6,20" fill="#000000" />
		</svg>
		<!-- Pause icon (hidden by default) -->
		<svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" style="display:none">
			<rect x="6" y="4" width="4" height="16" fill="#000000" />
			<rect x="14" y="4" width="4" height="16" fill="#000000" />
		</svg>
	</button>
	<button id="stop-btn" aria-label="Stop">
		<svg width="24" height="24" viewBox="0 0 24 24">
			<rect x="5" y="5" width="14" height="14" fill="#000000" />
		</svg>
	</button>
    <button id="display-toggle" class="voice-toggle" type="button" popovertarget="display-voices">Display: All</button>
    <button id="playback-toggle" class="voice-toggle" type="button" popovertarget="playback-voices">Playback: All</button>
    <span id="file-controls"></span>
    <button id="preferences-toggle" type="button" popovertarget="preferences-panel" aria-label="Personal music preferences" title="Personal music preferences">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.6-2-3.5-2.4 1a8 8 0 0 0-1.7-1L15 3h-4l-.4 2.9a8 8 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.6a7.8 7.8 0 0 0 0 2l-2 1.6 2 3.5 2.4-1a8 8 0 0 0 1.7 1L11 21h4l.4-2.9a8 8 0 0 0 1.7-1l2.4 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
        </svg>
    </button>
    </div>
    <div id="display-voices" class="voice-panel" popover aria-label="Display voices"></div>
    <div id="playback-voices" class="voice-panel" popover aria-label="Playback voices"></div>
    <div id="tempo-picker" popover aria-label="Choose playback tempo"></div>
    <div id="preferences-panel" popover aria-label="Personal music preferences">
        <h2>Personal music preferences</h2>
        <button id="open-web" type="button">Show in Web Editor</button>
    <section id="personal-controls" aria-label="Personal music preferences">
        <p id="preference-status" role="status">Loading personal preferences...</p>
    </section>
    </div>
	<!-- 
	 * The #sheet div is the container where all SVG music notation will be rendered
	 * abc.tosvg() will generate SVG content that gets inserted here via abc_images
	 * Each musical line/staff typically becomes a separate SVG element
	 -->
    <div id="preview-status" role="status" hidden></div>
	<div id="sheet"></div>
	<!--<div id="sheet" style="border:1px solid black;	width:800px; height:1200px;padding:0px"></div>-->
	<!-- 
	 * preview.js - Compiled from preview.ts, contains all the logic for:
	 * 1. Rendering ABC notation to SVG
	 * 2. Handling playback
	 * 3. User interactions with the score
	 * 4. Communication with the VS Code extension
	 -->
	<script type="module" src="__BASE_URI__/out/webview/preview.js"></script>
</body>

</html>
